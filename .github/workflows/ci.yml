name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled

  push:
    branches:
      - main
      - master

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test

  build:
    name: Build
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-compose:
    name: Docker Compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: team-b-for-brilliant-frontend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          path: team-b-for-brilliant-frontend

      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-backend

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: team-b-for-brilliant-frontend/.nvmrc
          cache: npm
          cache-dependency-path: team-b-for-brilliant-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Generate missing CI signing keys
        run: |
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET=$(openssl rand -hex 32)
            printf '::add-mask::%s\n' "$JWT_SECRET"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -z "$COOKIE_SECRET" ]; then
            COOKIE_SECRET=$(openssl rand -hex 32)
            printf '::add-mask::%s\n' "$COOKIE_SECRET"
            printf 'COOKIE_SECRET=%s\n' "$COOKIE_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  on-merge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'Deployment'
      )
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: team-b-for-brilliant-frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-backend

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: team-b-for-brilliant-frontend/dist

      - name: AZ Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }} \
            --subscription ${{ secrets.SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and start services
        working-directory: team-b-for-brilliant-frontend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
        run: |
          docker compose up --build --wait --wait-timeout 120
          docker tag "$(docker compose images --quiet frontend)" ${{ secrets.ACR_NAME }}/frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}/frontend:${{ github.sha }}
