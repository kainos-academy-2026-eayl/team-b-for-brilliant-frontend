name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  merge:
    branches: [main]
    types: [closed]

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test

  build:
    name: Build
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-compose:
    name: Docker Compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: team-b-for-brilliant-backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v5
        with:
          path: team-b-for-brilliant-frontend

      - name: Checkout backend
        uses: actions/checkout@v5
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-backend

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: team-b-for-brilliant-backend/.nvmrc
          cache: npm
          cache-dependency-path: team-b-for-brilliant-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Generate missing CI signing keys
        run: |
          if [ -z "$JWT_SECRET" ]; then
            JWT_SECRET=$(openssl rand -hex 32)
            printf '::add-mask::%s\n' "$JWT_SECRET"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET" >> "$GITHUB_ENV"
          fi
          if [ -z "$COOKIE_SECRET" ]; then
            COOKIE_SECRET=$(openssl rand -hex 32)
            printf '::add-mask::%s\n' "$COOKIE_SECRET"
            printf 'COOKIE_SECRET=%s\n' "$COOKIE_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  on-merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: docker-compose
    steps:
      - ch

      - name: AZ Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }} \
            --subscription ${{ secrets.SUBSCRIPTION_ID }}

      - name: Log in to ACR
          run: |
            az acr login --name ${{ secrets.ACR_NAME }}

        - name: Build and start services
          working-directory: team-b-for-brilliant-backend
          env:
            JWT_SECRET: ${{ secrets.JWT_SECRET }}
            COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          run: |
            docker compose up --build --wait --wait-timeout 120
            docker tag "$(docker compose images --quiet frontend)" ${{ secrets.ACR_NAME }}/frontend:${{ github.sha }}
            docker push ${{ secrets.ACR_NAME }}/frontend:${{ github.sha }}

    terraform-plan:
    name: Terraform Plan Dev
    runs-on: ubuntu-latest
    needs: docker-compose
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      merged-pr: ${{ steps.merged-pr.outputs.result }}
      terraform-version: ${{ steps.terraform-version.outputs.version }}
    concurrency:
      group: terraform-backend-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
        shell: bash
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_environment: dev
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Record Terraform version
        id: terraform-version
        run: echo "version=$(terraform version -json | jq -r '.terraform_version')" >> "$GITHUB_OUTPUT"

      - name: Confirm merged pull request
        id: merged-pr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100
              }
            );
            return pullRequests.some(pr =>
              pr.merged_at !== null &&
              pr.base.ref === 'main' &&
              pr.merge_commit_sha === context.sha
            );

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=use_cli=false

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Upload Terraform plan
        if: steps.merged-pr.outputs.result == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: |
            my-infrastructure/tfplan
            my-infrastructure/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  terraform-apply:
    name: Terraform Apply Dev
    runs-on: ubuntu-latest
    needs: [terraform-plan, on-merge]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.merged-pr == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-backend-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: my-infrastructure
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.SUBSCRIPTION_ID }}
      TF_VAR_environment: dev
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ needs.terraform-plan.outputs.terraform-version }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: my-infrastructure

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=use_cli=false -lockfile=readonly

      - name: Apply Terraform plan
        run: terraform apply -input=false -lock-timeout=5m tfplan
