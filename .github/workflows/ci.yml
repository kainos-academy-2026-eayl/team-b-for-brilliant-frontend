name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - reopened
      - synchronize
      - labeled

  push:
    branches:
      - main
      - master

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run lint
      - run: npm run format
      - run: npm test

  e2e:
    name: Test harness gate
    needs: lint-test
    uses: ./.github/workflows/trigger-e2e.yml
    secrets:
      E2E_DISPATCH_TOKEN: ${{ secrets.E2E_DISPATCH_TOKEN }}

  build:
    name: Build
    needs: e2e
    if: needs.e2e.outputs.result == 'pass'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build

  docker-compose:
    name: Docker Compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: team-b-for-brilliant-backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-backend
          token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-backend

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: team-b-for-brilliant-frontend

      - name: Setup Node.js for backend
        uses: actions/setup-node@v5
        with:
          node-version-file: team-b-for-brilliant-backend/.nvmrc
          cache: npm
          cache-dependency-path: team-b-for-brilliant-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans

  on-merge:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'pull_request' &&
        github.base_ref == 'main' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'Deployment'
      )
    runs-on: ubuntu-latest
    needs: docker-compose
    timeout-minutes: 20
    defaults:
      run:
        working-directory: team-b-for-brilliant-backend
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: team-b-for-brilliant-frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: kainos-academy-2026-eayl/team-b-for-brilliant-backend
          token: ${{ secrets.BRILLIANT_REPO_TOKEN || github.token }}
          path: team-b-for-brilliant-backend

      - name: Setup Node.js for backend
        uses: actions/setup-node@v5
        with:
          node-version-file: team-b-for-brilliant-backend/.nvmrc
          cache: npm
          cache-dependency-path: team-b-for-brilliant-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: AZ Login
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --password ${{ secrets.AZURE_SECRET }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }} \
            --subscription ${{ secrets.SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and start services
        run: docker compose up --build --wait --wait-timeout 120

      - name: Check frontend health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      - name: Push frontend image
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "$(docker compose images --quiet frontend)" "$ACR_NAME/frontend:$IMAGE_TAG"
          docker push "$ACR_NAME/frontend:$IMAGE_TAG"

      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
