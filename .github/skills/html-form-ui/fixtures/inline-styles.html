<div class="form-wrapper">
  <h2 class="form-title" style="text-align: center">Newsletter</h2>
  <form action="/subscribe" method="post" style="padding: 20px">
    <fieldset class="form-section" style="margin-bottom: 24px; border: none">
      <legend class="form-legend">Sign up</legend>
      <div class="form-field" style="margin-top: 8px">
        <label for="email" class="form-label" style="font-weight: bold">Email</label>
        <input id="email" name="email" type="email" style="width: 100%; padding: 4px">
      </div>
      <div class="form-field" style="display: none">
        <label for="trap" class="form-label">Leave blank</label>
        <input id="trap" name="trap" type="text">
      </div>
    </fieldset>
    <div class="form-actions" style="display: flex; gap: 12px">
      <button type="submit" class="btn btn-primary" style="color: white">Subscribe</button>
    </div>
  </form>
</div>
