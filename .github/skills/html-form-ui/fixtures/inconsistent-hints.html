<div class="form-wrapper">
  <h2 class="form-title">Payment</h2>
  <form action="/pay" method="post">
    <fieldset class="form-section">
      <legend class="form-legend">Card details</legend>
      <div class="form-field">
        <label for="card" class="form-label">Card number</label>
        <input id="card" name="card" type="text" inputmode="numeric">
        <small class="help-text">The long number on the front of your card</small>
      </div>
      <div class="form-field">
        <label for="expiry" class="form-label">Expiry date</label>
        <span class="hint">For example, 04/28</span>
        <input id="expiry" name="expiry" type="text">
      </div>
      <div class="form-field">
        <label for="cvc" class="form-label">Security code</label>
        <p id="cvc-hint" class="form-hint">The last 3 digits on the back</p>
        <input id="cvc" name="cvc" type="text">
      </div>
    </fieldset>
    <p class="form-hint">All payments are encrypted.</p>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Pay now</button>
    </div>
  </form>
</div>
