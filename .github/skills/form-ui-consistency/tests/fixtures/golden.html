<form class="form-ui" method="post">
  <h1>Contact details</h1>
  <fieldset class="form-section">
    <legend>Your email</legend>
    <div class="form-field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" aria-describedby="email-hint" />
      <p id="email-hint" class="form-hint">Use an address you check regularly.</p>
    </div>
  </fieldset>
  <div class="form-actions">
    <button type="submit" class="form-button-primary">Save</button>
    <button type="button" class="form-button-secondary">Cancel</button>
  </div>
</form>
